# Trois serveurs virtuels pour comparer les comportements.

# 1. Hybride préféré, repli classique autorisé (configuration cible de transition)
server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/classic.crt;
    ssl_certificate_key /etc/nginx/certs/classic.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1;
    location / { return 200 "hybride-prefere $ssl_protocol $ssl_curve\n"; }
}

# 2. Hybride exigé (aucun repli classique)
server {
    listen 9443 ssl;
    ssl_certificate     /etc/nginx/certs/classic.crt;
    ssl_certificate_key /etc/nginx/certs/classic.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:SecP384r1MLKEM1024;
    location / { return 200 "hybride-exige $ssl_protocol $ssl_curve\n"; }
}

# 3. Échange hybride + certificat ML-DSA-65 (pilote PKI interne)
server {
    listen 10443 ssl;
    ssl_certificate     /etc/nginx/certs/mldsa.crt;
    ssl_certificate_key /etc/nginx/certs/mldsa.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    location / { return 200 "pqc-complet $ssl_protocol $ssl_curve\n"; }
}
